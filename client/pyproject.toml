[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymkdb-client"
version = "0.1.5"
description = "Python client SDK for MkDB — connects via TCP socket or HTTP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "MNG" }
]
keywords = ["mkdb", "database", "client", "sdk", "nosql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
mkdb-client = "mkdb_client.cli:main"

[project.urls]
Homepage = "https://github.com/MNG/MkDB"
Repository = "https://github.com/MNG/MkDB"

[tool.setuptools.packages.find]
include = ["mkdb_client*"]
