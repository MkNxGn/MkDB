<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MkDB &mdash; Sign In</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --border-mid: #475569;
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.12);
            --blue-light: #60a5fa;
            --text: #e2e8f0;
            --text-heading: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: var(--blue-dim);
            border-radius: 16px;
            margin-bottom: 1rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            color: var(--blue-light);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-heading);
        }

        .logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-mid);
            border-radius: 7px;
            color: var(--text);
            padding: 0.65rem 0.75rem;
            font-size: 0.875rem;
            font-family: inherit;
            width: 100%;
            transition: border-color 0.15s;
        }

        input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .field-error {
            font-size: 0.73rem;
            color: #f87171;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.65rem 1.1rem;
            border: none;
            border-radius: 7px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: var(--blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .alert-box {
            border-radius: 7px;
            padding: 0.65rem 0.875rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-box.show {
            display: block;
        }

        .spinner-wrap {
            text-align: center;
            padding: 2rem 0;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <h1>MkDB</h1>
            <p>Database Control Panel</p>
        </div>
        <div class="card">
            <div id="loadingState" class="spinner-wrap">
                <div class="spinner"></div>
            </div>
            <div id="loginView" style="display:none">
                <p class="card-title" id="formTitle">Sign in</p>
                <div id="alertBox" class="alert-box"></div>
                <form id="authForm" onsubmit="handleSubmit(event)" novalidate>
                    <div class="form-group">
                        <label for="pwdInput">Password</label>
                        <input type="password" id="pwdInput" placeholder="Enter password" autocomplete="current-password">
                    </div>
                    <div class="form-group" id="confirmGroup" style="display:none">
                        <label for="pwdConfirm">Confirm Password</label>
                        <input type="password" id="pwdConfirm" placeholder="Confirm password" autocomplete="new-password">
                        <span class="field-error" id="confirmErr" style="display:none">Passwords do not match</span>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        let isSetup = false;

        async function checkStatus() {
            try {
                const res = await fetch('/auth/status');
                const d = await res.json();
                document.getElementById('loadingState').style.display = 'none';
                if (!d.enabled) {
                    window.location.href = '/home';
                    return;
                }
                document.getElementById('loginView').style.display = '';
                if (!d.has_password) {
                    isSetup = true;
                    document.getElementById('formTitle').textContent = 'Set your password';
                    document.getElementById('submitBtn').textContent = 'Set Password';
                    document.getElementById('confirmGroup').style.display = '';
                    document.getElementById('pwdInput').placeholder = 'Choose a password';
                    document.getElementById('pwdInput').setAttribute('autocomplete', 'new-password');
                }
            } catch (e) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('loginView').style.display = '';
                showAlert('Could not reach server.');
            }
        }

        function showAlert(msg) {
            const el = document.getElementById('alertBox');
            el.textContent = msg;
            el.classList.add('show');
        }
        function hideAlert() { document.getElementById('alertBox').classList.remove('show'); }

        document.getElementById('pwdConfirm').addEventListener('input', function () {
            const match = document.getElementById('pwdInput').value === this.value;
            document.getElementById('confirmErr').style.display = (this.value && !match) ? '' : 'none';
        });

        async function handleSubmit(e) {
            e.preventDefault();
            hideAlert();
            const pwd = document.getElementById('pwdInput').value;
            if (!pwd) { showAlert('Please enter a password.'); return; }
            if (isSetup) {
                const conf = document.getElementById('pwdConfirm').value;
                if (pwd !== conf) { showAlert('Passwords do not match.'); return; }
                if (pwd.length < 6) { showAlert('Password must be at least 6 characters.'); return; }
            }
            const btn = document.getElementById('submitBtn');
            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Please wait...';
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (res.status === 401) {
                    showAlert('Incorrect password.');
                    btn.disabled = false; btn.textContent = origText; return;
                }
                const d = await res.json();
                if (res.ok && d.token) {
                    document.cookie = 'mkdb_token=' + encodeURIComponent(d.token) + '; path=/; SameSite=Strict';
                    window.location.href = '/home';
                } else {
                    showAlert(d.message || 'Login failed.');
                    btn.disabled = false; btn.textContent = origText;
                }
            } catch (err) {
                showAlert('Network error. Please try again.');
                btn.disabled = false; btn.textContent = origText;
            }
        }

        checkStatus();
    </script>
</body>

</html>
